set(){M("Settings",`<p>Volume</p><input id="vr" type="range" min="0" max="1" step=".05" value="${S.set.vol}" style="width:100%;margin-bottom:14px">${B("snd","Sound: "+(S.set.snd?"on":"off"))}${B("fs","Fullscreen")}${B("reset","Reset progress")}`)},
snd(){S.set.snd=S.set.snd?0:1;vol();save();ACT.set()},
fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()},
reset(){M("Reset progress","<p>Erase ALL progress?</p>"+B("resetgo","Erase")+B("close","Cancel"))},resetgo(){try{localStorage.removeItem(KEY)}catch(e){}const st=S.set;S=DEF();S.set=st;X();ACT.menu()},
cred(){M("Credits","<p>THE EXIT PROTOCOL\nA browser escape-room mystery.\n\nBuilt with HTML, CSS and JavaScript. All visuals and sound are generated in code.</p>")},
menu(){X();$("#game").classList.remove("on");$("#menu").classList.add("on");$("[data-a=cont]").disabled=!ld()},
pause(){const h=Object.values(S.rh).reduce((a,b)=>a+b,0);M("Paused",`<p>Completion ${Math.round(S.done.length/15*100)}% · Playtime ${fmtT(S.t)} · Hints used ${h}</p>`+B("close","Resume")+B("rr","Restart room")+B("ach","Achievements")+B("set","Settings")+B("menu","Main menu"))},
ach(){M("Achievements",Object.keys(ACH).map(k=>`<p style="opacity:${S.ach.includes(k)?1:.4}"><b>${S.ach.includes(k)?"◆":"◇"} ${ACH[k][0]}</b>\n${ACH[k][1]}</p>`).join(""))},
rr(){M("Restart room","<p>Restart this room? Its progress and items will be reset.</p>"+B("rrgo","Restart")+B("close","Cancel"))},rrgo(){const n=S.room;delete S.f[n];S.inv=S.inv.filter(i=>IT[i].r!=n);S.j=S.j.filter(e=>e.r!=n);start(n)},
journal(){M("Investigation journal",S.j.length?S.j.map(e=>`<p><b style="color:var(--cold)">${e.t}</b>\n${e.x}</p>`).join(""):"<p>Nothing recorded yet. Inspect things.</p>")},
hint(){hintUI()},hn(){const[i]=stepH(),k=S.room+"-"+i;S.hl[k]=(S.hl[k]||0)+1;S.rh[S.room]=(S.rh[S.room]||0)+1;save();hintUI()},
item(d){const i=IT[d.i];sfx("click");M(i.n,`<div class="sl" style="margin-bottom:12px"><svg viewBox="0 0 24 24">${IC[i.t]}</svg></div><p>${i.x}</p>`)},
obj(d){sfx("click");OB[S.room][d.o](F())},
dk(){const f=F();f.desk=1;give("note1",1);give("driver",1);toast("Picked up: note, screwdriver");jr("n1","Note from the desk",IT.note1.x);M("Desk","<p>Inside: a folded note and a flat-head screwdriver.</p>"+B("close","Close"))},
vv(){F().vent=1;give("badge");jr("bg","Hidden badge","Taped behind the vent: an access badge marked SUBJECT 001. The name is scratched out.");renderAll();M("Ventilation panel","<p>The screws come loose. Behind the panel, taped to the duct: an access badge.</p>"+B("close","Close"))},
ib(){F().mon=1;save();renderAll();sfx("pc");OB[1].mon(F())},
k(d){sfx("key");const v=d.v;if(v==="C")K="";else if(v==="OK"){if(K==="0820"){const f=F();f.open=1;save();sfx("ok");jr("ac","Access granted","The monitor accepted the clock time as a code and called you SUBJECT 001: ACCEPTED.");M("Terminal","<p class='mono'>CODE ACCEPTED.\nSUBJECT 001: ACCEPTED.</p><p>Somewhere behind the wall, a lock releases.</p>"+B("close","Continue"));glitch();setTimeout(()=>{const e=$(".door");if(e){e.classList.add("open");$(".led").classList.add("g");sfx("door")}},900)}else{sfx("bad");K="";$("#kd").textContent="_ _ _ _";$("#km").textContent="ACCESS DENIED."}return}else if(K.length<4)K+=v;$("#kd").textContent=K.padEnd(4,"_").split("").join(" ")},
q(d){sfx("key");Q.push(d.v);$("#qd").textContent=Q.concat(["_","_","_","_"]).slice(0,4).join(" ");if(Q.length<4)return;
if(Q.join("")==="CADB"){const f=F();f.cab=1;give("tape",1);give("card",1);sfx("ok");jr("tp","Admission tape","02:13:50 — SUBJECT 001 ARRIVES. STATUS: VOLUNTARY. The signature on file is in your handwriting.");const v=f.v||{};ach("obs",f.board&&Object.keys(v).length==4);renderAll();glitch();M("Tape 0114","<p class='mono'>02:13:50 — ADMISSION LOG\nSUBJECT 001 ARRIVES.\nSTATUS: VOLUNTARY.\nSIGNATURE ON FILE.</p><p>The footage shows the entrance, and a figure signing a form without hesitation. The handwriting is yours.</p><p>Whoever locked you in here, you walked in on your own.</p><p>The cabinet also held an exit keycard.</p>"+B("close","Continue"));save()}
else{sfx("bad");Q=[];$("#qd").textContent="_ _ _ _";$("#km").textContent="Wrong sequence. The cabinet buzzes."}},
uc(){F().open=1;save();X();sfx("door");$(".door").classList.add("open");$(".led").classList.add("g");setTimeout(fin,2000)}};
const pt=k=>{if(S.set.snd&&AX)tn(260+k*120,.2,"sine",.12)};
Object.assign(ACT,{pa(){const v=norm($("#pi").value);cp.p.a.map(norm).includes(v)?psolve():pbad("Rejected.")},
po(d){sfx("key");PS.push(+d.v);$("#od").textContent=PS.join("   ");if(PS.length<cp.p.N)return;if(JSON.stringify(PS)==JSON.stringify(cp.p.ans))psolve();else{PS=[];$("#od").innerHTML="&nbsp;";pbad("Wrong order. Cleared.")}},
pc(){PS=[];$("#od").innerHTML="&nbsp;"},
pl(d){sfx("key");tgl(PL,cp.p.z,+d.v);$("#lg").innerHTML=lgh();if(PL.every(v=>!v))psolve()},
yplay(){if(MT)return;const p=cp.p,sp=Math.max(320,700-S.room*25),pads=[...$("#yp").children];PS=[];MT=1;
p.seq.forEach((c,j)=>setTimeout(()=>{pads[c].style.opacity=1;pt(c);setTimeout(()=>pads[c].style.opacity=.45,sp*.6)},400+j*sp));setTimeout(()=>MT=0,400+p.seq.length*sp)},
py(d){if(MT)return;const k=+d.v,p=cp.p,pads=[...$("#yp").children];pt(k);pads[k].style.opacity=1;setTimeout(()=>pads[k].style.opacity=.45,150);PS.push(k);const j=PS.length-1;
if(PS[j]!=p.seq[j]){PS=[];pbad("Wrong pad. Sequence reset.");return}if(PS.length==p.seq.length)psolve()},
kk(d){sfx("key");const P=LV(S.room),v=d.v,bl=Array(P.ns).fill("_").join(" ");
if(v==="C")K="";else if(v==="OK"){if(K===P.code){const f=F();f.open=1;save();sfx("ok");X();glitch();setTimeout(()=>{const e=$(".door");if(e){e.classList.add("open");$(".led").classList.add("g");sfx("door")}setTimeout(fin,1800)},500)}else{sfx("bad");K="";$("#kd").textContent=bl;$("#km").textContent="ACCESS DENIED."}return}
else if(K.length<P.ns)K+=v;$("#kd").textContent=K.padEnd(P.ns,"_").split("").join(" ")}});
addEventListener("keydown",e=>{if(e.key=="Enter"&&isOpen()&&$("#pi"))ACT.pa()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset)});
document.addEventListener("input",e=>{if(e.target.id=="vr"){S.set.vol=+e.target.value;vol();save()}});
addEventListener("keydown",e=>{if(!$("#game").classList.contains("on"))return;const k=e.key.toLowerCase();if(k=="escape")isOpen()?X():ACT.pause();else if(!isOpen()){if(k=="j")ACT.journal();if(k=="h")ACT.hint()}});
setInterval(()=>{if($("#game").classList.contains("on")&&!document.hidden){S.t++;if(S.t%10==0)save()}},1000);
$("[data-a=cont]").disabled=!ld();
